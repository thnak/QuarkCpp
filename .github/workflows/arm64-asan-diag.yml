# Manual diagnostic: why do these tests take ~100x longer on arm64 ASan than on x86-64 ASan?
# (e.g. cluster_swim_partition_heal_test 12s vs 1509s). Builds the asan-ubsan config on a native
# arm64 runner, runs each named test with a wall-clock cap, and dumps every thread's backtrace
# several times while it runs, so a livelock / lost wakeup shows up as the same stack repeating.
# Never gates anything: run it from the Actions tab (workflow_dispatch).
name: arm64-asan-diag

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Space-separated test targets"
        default: "topology_fifo_under_relay_test cluster_swim_partition_heal_test"
      cap_seconds:
        description: "Wall-clock cap per test (s)"
        default: "300"

jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/thnak/quark-ci@sha256:25a8819b9dee2399a54d00e876d1a36af24242f014c56e4a5152a9a54e53ad91
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install toolchain
        run: bash ci/install-deps.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 -DQUARK_SANITIZE="address;undefined"

      - name: Build
        shell: bash
        run: cmake --build build -j 2 --target ${{ inputs.tests }}

      - name: Run under gdb, snapshot stacks on SIGUSR1
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set +e
          nproc; uname -m
          # The container has no ptrace-attach, so launch the test under gdb and stop it with a
          # signal gdb catches (SIGUSR1) instead of `gdb -p`.
          for t in ${{ inputs.tests }}; do
            echo "::group::$t"
            gdb -batch -ex "set pagination off" -ex "handle SIGUSR1 stop nopass"                 -ex run -ex "thread apply all bt 25" -ex "info threads"                 -ex continue -ex "thread apply all bt 25" -ex kill                 --args "build/tests/$t" >"/tmp/$t.gdb" 2>&1 &
            gpid=$!
            for at in 30 60; do
              sleep $(( at == 30 ? 30 : 30 ))
              pkill -USR1 -x "${t:0:15}" || echo "(test already exited)"
              sleep 3
            done
            kill -9 "$gpid" 2>/dev/null; pkill -9 -x "${t:0:15}" 2>/dev/null
            wait "$gpid" 2>/dev/null
            cat "/tmp/$t.gdb" | cut -c1-240
            echo "::endgroup::"
          done

      - name: Timing A/B (fake-stack use-after-return on vs off)
        shell: bash
        run: |
          set +e
          for t in ${{ inputs.tests }}; do
            for uar in 1 0; do
              s=$(date +%s)
              ASAN_OPTIONS=abort_on_error=0:detect_stack_use_after_return=$uar timeout 400 "build/tests/$t" >/dev/null 2>&1
              echo "RESULT $t detect_stack_use_after_return=$uar exit=$? elapsed=$(( $(date +%s) - s ))s"
            done
          done

      - name: Toolchain micro-benchmark (is the fake stack slow independent of Quark?)
        shell: bash
        run: |
          set +e
          g++-14 --version | head -1; clang++-22 --version | head -1
          for cxx in g++-14 clang++-22; do
            $cxx -std=c++23 -O0 -g -fsanitize=address,undefined ci/diag/asan_fakestack_micro.cpp -o /tmp/micro_$cxx 2>&1 | tail -3
            for uar in 1 0; do
              echo -n "RESULT micro $cxx uar=$uar: "
              ASAN_OPTIONS=detect_stack_use_after_return=$uar timeout 300 /tmp/micro_$cxx || echo "exit=$?"
            done
          done
