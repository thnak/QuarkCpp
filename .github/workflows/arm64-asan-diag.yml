# Manual diagnostic: why do these tests take ~100x longer on arm64 ASan than on x86-64 ASan?
# (e.g. cluster_swim_partition_heal_test 12s vs 1509s). Builds the asan-ubsan config on a native
# arm64 runner, runs each named test with a wall-clock cap, and dumps every thread's backtrace
# several times while it runs, so a livelock / lost wakeup shows up as the same stack repeating.
# Never gates anything: run it from the Actions tab (workflow_dispatch).
name: arm64-asan-diag

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Space-separated test targets"
        default: "topology_fifo_under_relay_test cluster_swim_partition_heal_test"
      cap_seconds:
        description: "Wall-clock cap per test (s)"
        default: "300"

jobs:
  diag:
    runs-on: ubuntu-24.04-arm
    container:
      image: ghcr.io/thnak/quark-ci@sha256:25a8819b9dee2399a54d00e876d1a36af24242f014c56e4a5152a9a54e53ad91
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Install toolchain
        run: bash ci/install-deps.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14 -DQUARK_SANITIZE="address;undefined"

      - name: Build
        shell: bash
        run: cmake --build build -j 2 --target ${{ inputs.tests }}

      - name: Run with periodic backtraces
        shell: bash
        env:
          ASAN_OPTIONS: abort_on_error=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          nproc; uname -m
          for t in ${{ inputs.tests }}; do
            echo "::group::$t"
            start=$(date +%s)
            "build/tests/$t" >"/tmp/$t.log" 2>&1 &
            pid=$!
            n=0
            while kill -0 "$pid" 2>/dev/null; do
              sleep 5
              el=$(( $(date +%s) - start ))
              # snapshots at 20s, 60s, 120s: identical stacks across snapshots = livelock/stall
              if [[ $el -ge 20 && $n -eq 0 ]] || [[ $el -ge 60 && $n -eq 1 ]] || [[ $el -ge 120 && $n -eq 2 ]]; then
                n=$((n+1))
                echo "--- backtrace snapshot $n at ${el}s ---"
                sudo gdb -p "$pid" -batch -ex "set pagination off" -ex "thread apply all bt 12" -ex detach -ex quit 2>&1 | grep -E '^(Thread|#)' || true
                echo "--- per-thread CPU (top) ---"
                top -H -b -n1 -p "$pid" | head -20 || true
              fi
              if [[ $el -ge ${{ inputs.cap_seconds }} ]]; then
                echo "::warning::$t exceeded ${{ inputs.cap_seconds }}s cap — killing"
                kill -9 "$pid"; break
              fi
            done
            wait "$pid" 2>/dev/null; echo "$t exit=$? elapsed=$(( $(date +%s) - start ))s"
            tail -n 30 "/tmp/$t.log"
            echo "::endgroup::"
          done
