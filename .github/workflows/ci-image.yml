# Build the digest-addressed Linux CI image from ci/Dockerfile (base pinned by digest, exact apt
# toolchain from ci/apt-packages.txt). After the first run, copy the printed image digest into
# CI_IMAGE in ci/pins.env and the container.image lines in ci.yml/release.yml, then rerun the pin
# audit. Until that deliberate bump the all-zero placeholder fails closed.
name: CI image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      # Deliberately excludes ci/pins.env: bumping CI_IMAGE must not change the image it points to.
      # A compiler/toolchain bump still needs a workflow_dispatch build + new pin.
      - 'ci/Dockerfile'
      - 'ci/apt-packages.txt'
      - 'ci/install-deps.sh'
      - '.github/workflows/ci-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build + push (amd64/arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Audit pins (base digest, exact apt lock)
        run: bash ci/check_pins.sh --self-test

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/quark-ci:latest
          provenance: true
          sbom: true

      - name: Print the CI_IMAGE pin
        run: |
          echo "CI_IMAGE=ghcr.io/${{ github.repository_owner }}/quark-ci@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin this exact @sha256 digest in ci/pins.env and the container.image lines." >> "$GITHUB_STEP_SUMMARY"
